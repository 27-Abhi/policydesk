# =====================================================================
# PolicyDesk Orchestration: AWS EC2 Free Tier (t2.micro / t3.micro)
# =====================================================================

services:
  # -------------------------------------------------------------------
  # 1. PostgreSQL 16 Alpine (Low-Memory Footprint)
  # -------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: policydesk_db
    restart: unless-stopped
    shm_size: 128mb  # CRITICAL: Prevents Postgres 16 POSIX shared memory exhaustion
    environment:
      POSTGRES_DB: policydesk
      POSTGRES_USER: policydesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policydesk_secure_pass}
    command: >
      postgres
        -c shared_buffers=64MB
        -c max_connections=25
        -c work_mem=4MB
        -c maintenance_work_mem=16MB
        -c effective_cache_size=128MB
        -c wal_buffers=4MB
        -c random_page_cost=1.1
        -c bgwriter_lru_maxpages=100
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - policydesk_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policydesk -d policydesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. PolicyDesk Dual-Port Application Gateway (Ports 8000 & 8001)
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policydesk_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://policydesk:${POSTGRES_PASSWORD:-policydesk_secure_pass}@db:5432/policydesk
      CHECKPOINT_DB_PATH: /app/data/checkpoints.db
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-policydesk}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    ports:
      - "8000:8000"  # Public Customer Chat Portal
      - "8001:8001"  # Restricted Compliance & Audit Operations
    volumes:
      - app_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - policydesk_net

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local

networks:
  policydesk_net:
    driver: bridge
