[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "policydesk"
version = "0.1.0"
description = "Escalation-aware fintech policy support agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "pyotp>=2.9.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
